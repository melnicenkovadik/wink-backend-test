services:
  mongo:
    image: mongo:8.0.38
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    # forwards SIGTERM to node, so the server can finish open requests
    init: true
    ports:
      - '3000:3000'
    environment:
      MONGODB_URI: mongodb://mongo:27017/wink_blog
      CMS_API_TOKEN: ${CMS_API_TOKEN:-wink-cms-hardcoded-token}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
